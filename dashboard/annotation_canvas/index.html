<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182538;background:#fff}button,select,input{font:inherit}button,select{border:1px solid #d8e0ea;border-radius:7px;background:#fff;color:#26364d;min-height:36px;padding:7px 11px}button{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}button:hover{background:#edf3fc;border-color:#9eb9e3}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #83b4ff;outline-offset:2px}button[aria-pressed=true]{background:#eaf1ff;border-color:#2563eb;color:#174eb5}button:disabled{opacity:.4;cursor:default}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid #dce3ed;border-radius:10px 10px 0 0}.separator{width:1px;height:24px;background:#dce3ed;margin:0 3px}.spacer{flex:1}.zoom{min-width:45px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}.stage{height:520px;position:relative;overflow:hidden;background:#111b2b;border:1px solid #26364d;outline:none;touch-action:none}.stage:focus-visible{box-shadow:inset 0 0 0 2px #83b4ff}canvas{width:100%;height:100%;display:block;touch-action:none}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #dce3ed;border-top:0;border-radius:0 0 10px 10px;font-size:12px;color:#54657c}.inspector{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:12px 0}.inspector label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#54657c}.inspector input{width:85px;padding:7px;border:1px solid #d8e0ea;border-radius:6px;color:#182538;background:white}.inspector input#physical{width:160px}.help{font-size:12px;line-height:1.7;color:#54657c;margin:6px 0}#error{color:#b42318;font-size:13px}#app:fullscreen{background:white;padding:16px;overflow:auto}#app:fullscreen .stage{height:calc(100vh - 200px)}@media(max-width:750px){.tooltext{display:none}.toolbar{gap:5px;padding:8px}.separator{margin:0}.footer{align-items:start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="app">
<div class="toolbar" role="toolbar" aria-label="Annotation tools">
<button id="draw" aria-pressed="true" title="Draw boxes (D)"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M2 5h6M5 2v6"/></svg><span class="tooltext">Draw</span></button>
<button id="select" aria-pressed="false" title="Select, move and resize boxes (V)"><svg viewBox="0 0 24 24"><path d="m5 3 14 9-7 1-3 7z"/></svg><span class="tooltext">Select</span></button>
<button id="pan" aria-pressed="false" title="Pan image (H). Hold Space temporarily."><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18m-12-6 3-3 3 3m-9 3-3 3 3 3m12-6 3 3-3 3m-12 3 3 3 3-3"/></svg><span class="tooltext">Pan</span></button>
<select id="category" aria-label="Box category"><option value="pothole">Pothole</option><option value="shadow">Shadow</option><option value="repaired_patch">Repaired patch</option><option value="manhole">Manhole</option><option value="ordinary_road">Ordinary road</option></select>
<span class="separator"></span>
<button id="undo" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M3 10h10a7 7 0 0 1 7 7"/></svg></button>
<button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m16 5 5 5-5 5m5-5H11a7 7 0 0 0-7 7"/></svg></button>
<button id="delete" title="Delete selected box (Delete)" aria-label="Delete selected box"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button>
<span class="spacer"></span>
<button id="out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span class="zoom" id="zoom">Fit</span>
<button id="in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
<button id="fit" title="Fit image (0)">Fit</button>
<button id="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></svg></button>
</div>
<div class="stage" id="stage" tabindex="0" aria-label="Image annotation canvas. D to draw, V to select, H to pan. Drag to create a box."><canvas id="canvas"></canvas></div>
<div class="footer"><span id="status" role="status" aria-live="polite">Loading image…</span><span><span id="sync" role="status">Ready</span> <button id="retry" hidden>Retry save</button></span></div>
<div class="inspector" id="inspector" hidden>
<label>Selected category<select id="selectedCategory" aria-label="Selected box category"></select></label>
<label>X<input id="x" type="number" min="0" step="1"></label><label>Y<input id="y" type="number" min="0" step="1"></label><label>Width<input id="w" type="number" min="1" step="1"></label><label>Height<input id="h" type="number" min="1" step="1"></label>
<label>Physical pothole ID<input id="physical" placeholder="Optional, e.g. road-001"></label>
</div>
<p class="help">Drag to draw. Select a box to move it or drag a corner/edge to resize. Wheel zooms at the pointer; Space + drag pans. D / V / H switch tools. Delete removes the selected box. Shortcuts apply only inside this editor.</p>
<div id="error" role="alert"></div>
</div>
<script src="editor.js"></script>
</body></html>
