# Retired US comparison recipe. Experiment 2 has its own source policy.
historical_manifest: data/training/pothole_v1/manifest.csv
# V4 requires the original V3 validation reference to reproduce its split.
validation_reference: data/training/pothole_us_v3
rdd_split_metadata: data/processed/rdd2022_v3/split_metadata.csv
rdd_root: data/raw/RDD2022
inventory: data/metadata/image_inventory.csv
annotations_root: data/annotations
roboflow_root: data/raw/RoboFlow Dataset
rdd_countries: [United_States]
include_local: true
include_mapillary: true
include_roboflow: false
protected_recording_ids: []
# Preserve ALL eligible reviewed local/Mapillary images by default.
# For controlled ablations pass --negative-ratio 0.25, 0.5, or 1.0.
negative_ratio: null
seed: 42
